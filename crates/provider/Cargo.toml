[package]
name = "provider"
description = "FastRDP custom Remote Desktop protocol provider (IWRdsProtocolManager COM in-proc server loaded by TermService)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fastrdp_provider"
crate-type = ["cdylib", "rlib"]

[dependencies]
protocol.workspace = true
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
]

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Enumeration_Pnp",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Pipes",
]

[dev-dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_System_RemoteDesktop"]

[lints]
workspace = true
