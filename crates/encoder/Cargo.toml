[package]
name = "encoder"
description = "FastRDP H.264 encoders (x264 default, OpenH264) with automatic x264 fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
openh264 = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[build-dependencies]
cc = "1"

[dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_System_LibraryLoader"]

[lints]
workspace = true
