[package]
name = "agent"
description = "FastRDP session agent: injects remote keyboard/mouse input inside a Windows session"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fastrdp-agent"
path = "src/main.rs"

[dependencies]
protocol.workspace = true

[dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"]

[lints]
workspace = true
