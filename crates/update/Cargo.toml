[package]
name = "update"
description = "FastRDP updates: signed release manifest, verified downloads, and the fastrdp-update service task"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastrdp-update"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap.workspace = true
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_System_Registry"]

[lints]
workspace = true
